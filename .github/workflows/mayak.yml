name: 'Маяк: сборка приложения'

# CI builds and tests on pull requests and the Mayak branch. Manual release mode
# requires the real gateway public key and the permanent Android signing secrets.
on:
  pull_request:
    branches: [ mayak ]
  push:
    branches: [ mayak ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Build release-ready signed artifacts (requires configured secrets)'
        type: boolean
        required: true
        default: false

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  # Откуда взять открытый ключ шлюза, если его нет в mayak/gateway_public.pem
  MAYAK_KEY_URL: https://mayaklight.ru/gw/public-key

jobs:
  Android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      QT_VERSION: '6.10.3'
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014
      APP_ANDROID_MIN_SDK: 28

    steps:
    - name: 'Освободить место на диске'
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
        df -h /

    - name: 'Исходники'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Qt для сборки'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Qt для Android arm64'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Python и conan'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - run: pip install "conan==2.28.0"

    # Smoke builds are unsigned. Release mode requires the permanent signing key;
    # no temporary key is ever presented as a distributable Android release.
    - name: 'Ключ подписи'
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ secrets.MAYAK_ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASS: ${{ secrets.MAYAK_ANDROID_KEYSTORE_PASS }}
      run: |
        test -n "$KEYSTORE_BASE64" || { echo "Missing MAYAK_ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
        test -n "$KEYSTORE_PASS" || { echo "Missing MAYAK_ANDROID_KEYSTORE_PASS" >&2; exit 1; }
        echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
        echo "QT_ANDROID_KEYSTORE_STORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
        echo "QT_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android.keystore" >> $GITHUB_ENV
        echo "QT_ANDROID_KEYSTORE_ALIAS=mayak" >> $GITHUB_ENV

    - name: 'Проверка ключа шлюза (release)'
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
      shell: bash
      run: |
        curl -fsS --retry 3 "$MAYAK_KEY_URL" -o "$RUNNER_TEMP/mayak-gateway-public.pem"
        grep -q '^-----BEGIN PUBLIC KEY-----' "$RUNNER_TEMP/mayak-gateway-public.pem"
        echo "PROD_AGW_PUBLIC_KEY<<MAYAK_KEY_EOF" >> "$GITHUB_ENV"
        cat "$RUNNER_TEMP/mayak-gateway-public.pem" >> "$GITHUB_ENV"
        echo "MAYAK_KEY_EOF" >> "$GITHUB_ENV"

    - name: 'Тестовый ключ шлюза (smoke only)'
      if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release) }}
      shell: bash
      run: |
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/mayak-smoke-private.pem" 2>/dev/null
        openssl pkey -in "$RUNNER_TEMP/mayak-smoke-private.pem" -pubout -out "$RUNNER_TEMP/mayak-smoke-public.pem"
        echo "PROD_AGW_PUBLIC_KEY<<MAYAK_KEY_EOF" >> "$GITHUB_ENV"
        cat "$RUNNER_TEMP/mayak-smoke-public.pem" >> "$GITHUB_ENV"
        echo "MAYAK_KEY_EOF" >> "$GITHUB_ENV"

    - name: 'Сборка'
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.release }}" == "true" ]]; then
          deploy/build.sh -t android --sign --abi arm64-v8a
        else
          deploy/build.sh -t android --abi arm64-v8a
        fi
        VERSION=$(grep CMAKE_PROJECT_VERSION:STATIC deploy/build/CMakeCache.txt | cut -d= -f2)
        mkdir -p out
        cp deploy/build/client/android-build/*.apk "out/MayakVPN_${VERSION}_android_arm64.apk"
        ls -l out

    - name: 'APK'
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
      uses: actions/upload-artifact@v7
      with:
        name: mayak-android
        path: out/*.apk
        retention-days: 30

    - name: 'Smoke APK (unsigned; not for installation)'
      if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release) }}
      uses: actions/upload-artifact@v7
      with:
        name: mayak-android-smoke-unsigned
        path: deploy/build/client/android-build/*.apk
        retention-days: 7

  Windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
    - name: 'Исходники'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: 'Инструменты Qt, Ninja, Conan'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: '6.10.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools qthttpserver qtwebsockets'
        dir: '${{ runner.temp }}'
        py7zrversion: '==0.22.*'

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 'UTF-8 console'
      shell: pwsh
      run: chcp 65001

    - name: 'Conan'
      shell: pwsh
      run: |
        python -m pip install "conan==2.28.0" ninja
        conan profile detect --force

    - name: 'Ключ шлюза для release build'
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
      shell: pwsh
      run: |
        $key = Join-Path $env:RUNNER_TEMP 'mayak-gateway-public.pem'
        Invoke-WebRequest -Uri $env:MAYAK_KEY_URL -OutFile $key -ErrorAction Stop
        if (-not (Select-String -Path $key -Pattern '^-----BEGIN PUBLIC KEY-----' -Quiet)) { throw 'Gateway key is not a PEM public key' }
        "PROD_AGW_PUBLIC_KEY<<MAYAK_KEY_EOF" >> $env:GITHUB_ENV
        Get-Content -Raw $key >> $env:GITHUB_ENV
        "MAYAK_KEY_EOF" >> $env:GITHUB_ENV

    - name: 'Тестовый ключ шлюза (smoke only)'
      if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release) }}
      shell: pwsh
      run: |
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$env:RUNNER_TEMP\mayak-smoke-private.pem" 2>$null
        openssl pkey -in "$env:RUNNER_TEMP\mayak-smoke-private.pem" -pubout -out "$env:RUNNER_TEMP\mayak-smoke-public.pem"
        $env:PROD_AGW_PUBLIC_KEY = Get-Content -Raw "$env:RUNNER_TEMP\mayak-smoke-public.pem"
        "PROD_AGW_PUBLIC_KEY<<MAYAK_KEY_EOF" >> $env:GITHUB_ENV
        Get-Content -Raw "$env:RUNNER_TEMP\mayak-smoke-public.pem" >> $env:GITHUB_ENV
        "MAYAK_KEY_EOF" >> $env:GITHUB_ENV

    - name: 'Сборка Windows smoke'
      shell: pwsh
      run: |
        chcp 65001
        $env:QT_ROOT = "$env:RUNNER_TEMP\Qt\6.10.3\msvc2022_64"
        cmake -S . -B out/windows-mayak -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TRY_COMPILE_CONFIGURATION=Release -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF -DAMNEZIA_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT"
        cmake --build out/windows-mayak --config Release --parallel 4
        cmake --build out/windows-mayak --config Release --target test_gateway_service_import --parallel 4
        ctest --test-dir out/windows-mayak/client/tests -R "GatewayServiceImportTest|XraySerializationTest" --output-on-failure --timeout 180
        ninja -C out/windows-mayak -t deps > out/windows-mayak/ninja-deps.txt
        if ((Get-Item out/windows-mayak/ninja-deps.txt).Length -eq 0) { throw 'Ninja dependency database is empty' }

    - name: 'Windows smoke artifacts (not for installation)'
      uses: actions/upload-artifact@v7
      with:
        name: mayak-windows-smoke
        path: |
          out/windows-mayak/client/MayakVPN.exe
          out/windows-mayak/service/server/MayakVPN-service.exe
          out/windows-mayak/ninja-deps.txt
        retention-days: 7
